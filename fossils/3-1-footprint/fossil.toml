name = "3-1-footprint"
description = "AmberMonkey Section 3.1: Baseline-tier footprint and residency at synchronized checkpoints, stock Firefox"
default_iterations = 1
allow_failure = true  # AWSY tearDown's perfherder aggregation hits math.log(0); harmless for us.

[analyze]
footprint = "analyses/footprint.py"

[figures.footprint-bar]
analysis = "footprint"
script = "figures/footprint_bar.py"

[variables]
# AWSY writes its raptor-style report + memory-report gzips into a
# --results dir. We reuse that dir as JS_INSTR_DIR: JitInstrReporter
# fires at every AWSY memory-report checkpoint (Start, StartSettled,
# TabsOpen, TabsOpenSettled, TabsOpenForceGC, TabsClosedExtraProcesses,
# TabsClosed, TabsClosedSettled, TabsClosedForceGC) and writes into $D.
INIT = "D=$(mktemp -d /tmp/amber-3-1.XXXXXX); export JS_INSTR=all JS_INSTR_DIR=$D JS_INSTR_MODE=structural JS_INSTR_RUN_ID=$(basename $D)"
TAIL = "cat $D/*.jsonl >&2; rm -rf $D"
AWSY_ARGS_QUICK = "--entities 5 --iterations 3 --per-tab-pause 3 --settle-wait-time 3"
AWSY_ARGS_FULL = "--iterations 5"

# Jitless prefs: force baseline interpreter by disabling Ion + Baseline
# JIT and setting the warm-up threshold to zero. Same env vars
# frostmonkey uses.
JITLESS = "JIT_OPTION_baselineJit=false JIT_OPTION_ion=false JIT_OPTION_baselineInterpreterWarmUpThreshold=0"

[variants]
# --- Browser: AWSY on tp5 (static pageset, no mitmproxy). ---
# Headline variant for §3.1. Structural mode captures artifact
# definition + lifecycle; snapshots fire at every AWSY memory-report
# checkpoint (Start, StartSettled, TabsOpen, TabsOpenSettled,
# TabsOpenForceGC, TabsClosedExtraProcesses, TabsClosed,
# TabsClosedSettled, TabsClosedForceGC).
awsy-tp5-stock-quick = "$INIT; cd @FIREFOX; @SANDBOX @MC_BROWSER ./mach awsy-test --tp5 $AWSY_ARGS_QUICK --binary @BIN_RELEASE --results $D 1>&2; $TAIL"
awsy-tp5-stock-full = "$INIT; cd @FIREFOX; @SANDBOX @MC_BROWSER ./mach awsy-test --tp5 $AWSY_ARGS_FULL --binary @BIN_RELEASE --results $D 1>&2; $TAIL"

# Sanity check: jitless forces baseline interpreter.
awsy-tp5-jitless-quick = "$INIT; cd @FIREFOX; @SANDBOX $JITLESS @MC_BROWSER ./mach awsy-test --tp5 $AWSY_ARGS_QUICK --binary @BIN_RELEASE --results $D 1>&2; $TAIL"

# tp6 variants deferred: on-disk pageset zips are in a format the
# mitmproxy 5.1.1 that AWSY hardcodes cannot parse ("Invalid data
# format"). Unblocking needs either (a) bumping
# testing/awsy/awsy/test_memory_usage.py's playback_version to 8.1.1+
# and refreshing the recording bundle, or (b) migrating to `./mach
# raptor` with an autoconfig-based periodic memory-report trigger.
# Both belong to Section 6 work, not §3.1.
# awsy-tp6-stock-quick   = TODO
# awsy-tp6-stock-full    = TODO
# awsy-tp6-jitless-quick = TODO

# --- Shell: hand-annotated snapshots at warmup/steady/post boundaries.
# Octane's run.js is a natural shell workload; snapshots are inserted
# via the instrSnapshot builtin. Requires a rebuilt shell (snapshot
# builtin landed in commit 3ce14984ec12).
shell-octane-warmup = "$INIT; cd @OCTANE_DIR; @JSSHELL -e 'instrSnapshot(\"warmup\");' -f run.js -e 'instrSnapshot(\"post\");' 1>&2; $TAIL"
