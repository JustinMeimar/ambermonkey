name = "3-4-generalization"
description = "AmberMonkey Section 3.4: leave-one-workload-out corpus coverage over stable artifact keys"
default_iterations = 1

[analyze]
generalization = "analyses/generalization.py"

[variants]
# No workload of its own. The analyzer reads all sibling records
# under ~/.fossil/projects/ambermonkey/3-3-concentration/records/ and
# cross-references their artifact keys.
derive-from-3-3 = "echo 'reading 3-3-concentration records for leave-one-out' >&2"
