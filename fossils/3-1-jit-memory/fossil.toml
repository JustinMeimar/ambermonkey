name = "3-1-jit-memory"
description = "Stock JIT allocation census on AWSY tp6: live instruction bytes, executable pools, smaps residency, and engine-owned machinery."
default_iterations = 5
# AWSY tearDown's perfherder aggregation hits math.log(0) with our per-run
# entity count; the memory report we care about has already been written.
allow_failure = true

[analyze]
allocation = "analyses/allocation.py"

[variables]
# Instrumentation is a runtime-owned per-process JSONL stream. AWSY's
# --results directory doubles as JS_INSTR_DIR so every content process
# and the parent write into the same tree the memory-report checkpoints
# already share.
INIT = "D=$(mktemp -d /tmp/amber-3-1.XXXXXX) && export JS_INSTR=lifecycle,snapshot JS_INSTR_DIR=$D JS_INSTR_MODE=structural JS_INSTR_RUN_ID=$(basename $D)"

# Reduce the raw JSONL stream and Perfherder output to a compact per-process
# summary on stdout, then drop the raw tree. The analyzer works from the
# summary.
EMIT = "python3 /home/justin/spidermonkey/ambermonkey/fossils/3-1-jit-memory/scripts/emit_allocation_summary.py \"$D\" && rm -rf \"$D\""

# AWSY defaults: entities = full tp6 pageset (32). One iteration is
# enough for the memory snapshot; the perfherder aggregation we throw
# away is what benefits from more.
AWSY_ARGS = "--iterations 1"
# Quick smoke: three entities, one iteration. Confirms plumbing before
# committing to a full run.
AWSY_ARGS_QUICK = "--entities 3 --iterations 1 --per-tab-pause 3 --settle-wait-time 3"

[variants]
# Full tp6 run. tp6 is the AWSY default so no --tp5. Reproduces the
# roughly 60-live-at-peak process census the paper uses.
awsy-tp6-stock = "$INIT && cd @FIREFOX && @SANDBOX @MC_BROWSER ./mach awsy-test $AWSY_ARGS --binary @BIN_RELEASE --results \"$D\" 1>&2 && $EMIT"

# Smoke variant for plumbing checks.
awsy-tp6-stock-quick = "$INIT && cd @FIREFOX && @SANDBOX @MC_BROWSER ./mach awsy-test $AWSY_ARGS_QUICK --binary @BIN_RELEASE --results \"$D\" 1>&2 && $EMIT"
