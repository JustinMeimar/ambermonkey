name = "3-2-intra-workload"
description = "Intra-workload frequency distribution: per-site Pareto over IC-attach events. Feeds section III.3 (banded CDF figure)."
default_iterations = 1
allow_failure = true

[analyze]
ic-rank = "analyses/ic_rank.py"

[figures.pareto-band-ic]
analysis = "ic-rank"
script = "figures/pareto_band_ic.py"

[variables]
# JSONL sink pattern from fossil 3-1: per-process JSONL under a mktemp
# dir, reduced by scripts/emit_ranks.py, dir dropped after.
INIT = "D=$(mktemp -d /tmp/amber-3-2.XXXXXX) && export JS_INSTR=all JS_INSTR_DIR=$D JS_INSTR_MODE=structural JS_INSTR_RUN_ID=$(basename $D)"
EMIT = "python3 /home/justin/spidermonkey/ambermonkey/fossils/3-2-intra-workload/scripts/emit_ranks.py \"$D\" && rm -rf \"$D\""

# Browsertime one-off page load per variant. --headless so it runs
# unattended; -n 1 for a single visit (enough for the frequency shape).
BT = "cd @FIREFOX && @SANDBOX @MC_BROWSER ./mach browsertime --headless -n 1 -b firefox --firefox.binaryPath @BIN_RELEASE"

[variants]
# Same site set as frostmonkey's ic-frequency so the outlier stories
# are already familiar and the two projects' banded CDFs read as
# siblings.
cnn           = "$INIT && $BT https://www.cnn.com/ 1>&2 && $EMIT"
wikipedia     = "$INIT && $BT https://en.wikipedia.org/wiki/Barack_Obama 1>&2 && $EMIT"
amazon        = "$INIT && $BT https://www.amazon.com/s?k=laptop 1>&2 && $EMIT"
imdb          = "$INIT && $BT https://www.imdb.com/title/tt0084967/ 1>&2 && $EMIT"
bing          = "$INIT && $BT https://www.bing.com/search?q=javascript 1>&2 && $EMIT"
fandom        = "$INIT && $BT https://marvel.fandom.com/wiki/Black_Panther 1>&2 && $EMIT"
stackoverflow = "$INIT && $BT https://stackoverflow.com/questions/927358/how-do-i-undo-the-most-recent-commits-in-git 1>&2 && $EMIT"
example       = "$INIT && $BT https://example.com 1>&2 && $EMIT"
