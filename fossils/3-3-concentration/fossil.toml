name = "3-3-concentration"
description = "AmberMonkey Section 3.3: within-workload Pareto over IC bodies and baseline functions (demand mode)"
default_iterations = 1

[analyze]
concentration = "analyses/concentration.py"

[variants]
# Demand mode: adds a prologue counter bump so entries-flush carries
# meaningful entered_count values. instrSnapshot("post") triggers a
# flush of all in-memory counters so we see steady-state distribution.
shell-ic-poly = "@INSTR_INIT_DEMAND; @JSSHELL -f @TESTS_DIR/ic-poly.js -e 'instrSnapshot(\"post\");' 1>&2; @INSTR_TAIL"

shell-octane-full = "@INSTR_INIT_DEMAND; cd @OCTANE_DIR && @JSSHELL -f run.js -e 'instrSnapshot(\"post\");' 1>&2; @INSTR_TAIL"

# Sunspider-style tight loops -- narrow IC surface, complementary to
# octane's broad surface.
shell-bench = "@INSTR_INIT_DEMAND; @JSSHELL -f @TESTS_DIR/bench.js -e 'instrSnapshot(\"post\");' 1>&2; @INSTR_TAIL"
